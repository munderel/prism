name: Google Calendar Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Serialize runs: a */15 schedule plus a manual dispatch could otherwise run two
# syncs at once. Per-user claim locks already guard data, but this avoids the
# wasted overlapping work entirely.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger background Google Calendar sync
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PRODUCTION_URL }}/api/cron/google-sync")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Unexpected status $HTTP_STATUS"
            exit 1
          fi
