name: Meeting Reminders

# Runs every 5 minutes to send "meeting in 10 minutes" push notifications.
# Replaces the Vercel cron (not available on Hobby plan at sub-daily frequency).
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   CRON_SECRET   — same value as CRON_SECRET in Vercel environment variables
#   PRODUCTION_URL — your Vercel deployment URL, e.g. https://your-app.vercel.app

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger meeting reminders
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PRODUCTION_URL }}/api/cron/meeting-reminders")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Unexpected status $HTTP_STATUS"
            exit 1
          fi
