name: Derailing Check

on:
  schedule:
    - cron: '0 18-23 * * *'
  workflow_dispatch:

# Serialize runs: a manual dispatch or a delayed schedule can't overlap an
# in-flight run and double-send notifications. Queue rather than cancel so a
# tick is never dropped.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger derailing check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PRODUCTION_URL }}/api/cron/derailing")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Unexpected status $HTTP_STATUS"
            exit 1
          fi
